name: Tack CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check formatting and metadata
        run: |
          git diff --check
          plutil -lint Resources/Info.plist
          plutil -lint Resources/TackWidgets-Info.plist
          plutil -lint Resources/Tack.entitlements
          plutil -lint Resources/TackWidgets.entitlements

      - name: Run tests with coverage
        run: swift test --enable-code-coverage

      # CI runners cannot sign with the private Apple Team identity required
      # for Tack's shared App Group. Only authenticated local release builds
      # should create installable .app bundles via scripts/build-app.sh.
      - name: Compile release executables
        run: |
          swift build -c release --product Tack
          swift build -c release --product TackWidgets
          swift build -c release --product tackkit

      - name: Verify release executables
        run: |
          BIN_DIR="$(swift build -c release --show-bin-path)"
          test -x "$BIN_DIR/Tack"
          test -x "$BIN_DIR/TackWidgets"
          test -x "$BIN_DIR/tackkit"
